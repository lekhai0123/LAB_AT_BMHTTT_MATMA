name: Maven build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and package
        run: mvn -B -DskipTests package
      - name: Capture Swing screens for the report
        run: xvfb-run -a mvn -B -DskipTests test-compile exec:java -Dexec.classpathScope=test -Dexec.mainClass=week_01.CaptureScreens
      - uses: actions/upload-artifact@v4
        with:
          name: lab1-ui-evidence
          path: report/evidence/*.png
          if-no-files-found: error
